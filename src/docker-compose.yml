name: homewbot_proj

services:
  homewbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homewbot
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      # SQLite database and textbooks live next to the repo (in ../data)
      # so they survive redeploys and git pull
      - ../data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('https://api.telegram.org', timeout=10)\""]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # Optional: to route Telegram traffic through your own telegram-bot-api
  # server (removes the 20 MB file limit), put this service and your
  # telegram-bot-api container on a shared Docker network and set
  # TG_API_BASE in ../.env to its address, e.g. http://tg-bot-api:8080
