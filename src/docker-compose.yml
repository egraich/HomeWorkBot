name: homewbot_proj

services:
  homewbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homewbot
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      # SQLite + textbooks live one level above src (like *.db of the
      # neighbor bots) and survive redeploys / git pull
      - ../data:/app/data
    networks:
      # voicenet is the shared external network where tgapibot (own Bot API
      # server) lives; the bot reaches it at http://tgapibot:8080 (TG_API_BASE)
      - voicenet
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('https://api.telegram.org', timeout=10)\""]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

networks:
  voicenet:
    external: true
