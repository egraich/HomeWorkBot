name: homewbot_proj

services:
  homewbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homewbot
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      # SQLite + учебники живут на уровень выше src — как *.db соседних ботов
      - ../data:/app/data
    networks:
      # voicenet — общая external-сеть, в ней живёт tgapibot (свой Bot API сервер).
      # С ним бот общается по http://tgapibot:8080 (см. TG_API_BASE в .env)
      - voicenet
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('https://api.telegram.org', timeout=10)\""]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

networks:
  voicenet:
    external: true
